[workspace]
members = [
    "qi-value",
    "qi-macros",
    "qi-format",
    "qi-messaging",
    "qi",
    "examples",
    "tests-macros",
    # "qi-tools",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Vincent PALANCHER"]
version = "1.0.0-dev"
license-file = "LICENSE.txt"
rust-version = "1.75"

[workspace.dependencies]
assert_matches = "1.5.0"
async-stream = "0.3.6"
async-trait = "0.1.89"
bytes = { version = "1.10.1", features = ["serde"] }
derive_more = { version = "2.0.1", features = ["display", "from", "into", "index", "into_iterator"] }
dirs = "6.0.0"
either = "1.15.0"
futures = "0.3.31"
once_cell = "1.21.3"
ordered-float = { version = "5.1.0", features = ["serde"] }
pin-project-lite = "0.2.16"
pretty_assertions = "1.4.1"
sealed = "0.6.0"
seq-macro = "0.3.6"
serde = { version = "1.0.228", features = ["derive"] }
serde-value = "0.7.0"
serde_json = "1.0.145"
serde_with = "3.14.1"
serde_test = "1.0.177"
sha1_smol = "1.0.1"
syn = { version = "2.0.110", features = ["full", "extra-traits"] }
sysinfo = "0.36.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt", "time", "net", "macros"] }
tokio-test = "0.4.4"
tokio-util = { version = "0.7.17", features = ["codec"] }
tracing = "0.1.41"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "v5"] }
